server:
  port: ${SCORE_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/score_engine_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/auth/realms/score-realm}

logging:
  level:
    org.springframework.web: INFO
    br.com.scoreengine: INFO

app:
  decision:
    enabled: ${DECISION_ENABLED:true}
    url: ${DECISION_URL:http://localhost:8081}
    # OBSERVAÇÕES:
    # mudar localhost para o ip da máquina rodando o decisão
    # se estiver rodando na mesma máquina, mantenha como localhost
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
